<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    {% include head.html %}
  </head>
  <body
    class="font-sans bg-white text-slate-900 dark:bg-neutral-950 dark:text-slate-100 antialiased"
  >
    {% include header.html %}

    <main class="min-h-[70vh]">{{ content }}</main>

    {% include footer.html %}

    <!-- Floating WhatsApp Icon Button -->
    <div
      id="wa-float"
      class="hidden md:block"
      style="
        position: fixed;
        right: 28px;
        bottom: 28px;
        z-index: 9999;
        display: none;
      "
      data-settings='{
        "telephone":"6282145390784",
        "mobile_only":false,
        "button_delay":3,
        "message_views":1,
        "message_badge":true,
        "message_send":"Hi The SOLIMANS! I need more info about The SOLIMANS https://thesolimans.co",
        "message_hash":"d9a13fe0"
      }'
    >
      <a
        id="wa-float-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Chat via WhatsApp"
        class="group inline-flex items-center justify-center h-16 w-16 rounded-full bg-[#25D366] shadow-[0_18px_35px_rgba(0,0,0,.35)] transition-all duration-300 ease-out hover:-translate-y-1 hover:shadow-[0_24px_55px_rgba(0,0,0,.45)] focus:-translate-y-1 focus:shadow-[0_24px_55px_rgba(0,0,0,.45)] focus:outline-none focus:ring-4 focus:ring-[#25D366]/30"
      >
        <!-- WhatsApp icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          x="0px"
          y="0px"
          width="40"
          height="40"
          viewBox="0 0 48 48"
        >
          <path
            fill="#fff"
            d="M4.9,43.3l2.7-9.8C5.9,30.6,5,27.3,5,24C5,13.5,13.5,5,24,5c5.1,0,9.8,2,13.4,5.6C41,14.2,43,18.9,43,24c0,10.5-8.5,19-19,19c0,0,0,0,0,0h0c-3.2,0-6.3-0.8-9.1-2.3L4.9,43.3z"
          ></path>
          <path
            fill="#40c351"
            d="M35.2,12.8c-3-3-6.9-4.6-11.2-4.6C15.3,8.2,8.2,15.3,8.2,24c0,3,0.8,5.9,2.4,8.4L11,33l-1.6,5.8l6-1.6l0.6,0.3c2.4,1.4,5.2,2.2,8,2.2h0c8.7,0,15.8-7.1,15.8-15.8C39.8,19.8,38.2,15.8,35.2,12.8z"
          ></path>
          <path
            fill="#fff"
            fill-rule="evenodd"
            d="M19.3,16c-0.4-0.8-0.7-0.8-1.1-0.8c-0.3,0-0.6,0-0.9,0s-0.8,0.1-1.3,0.6c-0.4,0.5-1.7,1.6-1.7,4s1.7,4.6,1.9,4.9s3.3,5.3,8.1,7.2c4,1.6,4.8,1.3,5.7,1.2c0.9-0.1,2.8-1.1,3.2-2.3c0.4-1.1,0.4-2.1,0.3-2.3c-0.1-0.2-0.4-0.3-0.9-0.6s-2.8-1.4-3.2-1.5c-0.4-0.2-0.8-0.2-1.1,0.2c-0.3,0.5-1.2,1.5-1.5,1.9c-0.3,0.3-0.6,0.4-1,0.1c-0.5-0.2-2-0.7-3.8-2.4c-1.4-1.3-2.4-2.8-2.6-3.3c-0.3-0.5,0-0.7,0.2-1c0.2-0.2,0.5-0.6,0.7-0.8c0.2-0.3,0.3-0.5,0.5-0.8c0.2-0.3,0.1-0.6,0-0.8C20.6,19.3,19.7,17,19.3,16z"
            clip-rule="evenodd"
          ></path>
        </svg>

        <!-- optional badge -->
        <span
          id="wa-badge"
          class="absolute -top-1 -right-1 hidden md:inline-flex items-center justify-center h-6 w-6 rounded-full bg-black text-white text-xs font-bold"
          style="display: none"
          aria-hidden="true"
          >1</span
        >
      </a>
    </div>

    <script>
      (function () {
        const root = document.getElementById("wa-float");
        if (!root) return;

        // hide on mobile if needed
        if (
          window.matchMedia &&
          window.matchMedia("(max-width: 767px)").matches
        )
          return;

        // parse settings
        let settings = {};
        try {
          settings = JSON.parse(root.getAttribute("data-settings") || "{}");
        } catch (e) {
          settings = {};
        }

        const tel = (settings.telephone || "").replace(/\D/g, "");
        const msg = settings.message_send || "";
        const delaySec = Number(settings.button_delay || 0);

        // Encode message safely
        const encodedMsg = encodeURIComponent(msg);

        // Always use wa.me link (works on desktop & mobile)
        const waLink = `https://wa.me/${tel}?text=${encodedMsg}`;

        // Set href
        const link = document.getElementById("wa-float-link");
        if (link) link.href = waLink;

        // badge logic
        const badge = document.getElementById("wa-badge");
        const viewsKey = `wa_msg_views_${settings.message_hash || "default"}`;
        const maxViews = Number(settings.message_views || 0);
        const showBadge = !!settings.message_badge;

        if (badge && showBadge && maxViews > 0) {
          const views = Number(localStorage.getItem(viewsKey) || "0");
          if (views < maxViews) {
            badge.style.display = "inline-flex";
            localStorage.setItem(viewsKey, String(views + 1));
          }
        }

        // show after delay
        setTimeout(
          () => {
            root.style.display = "block";
          },
          Math.max(0, delaySec) * 1000,
        );
      })();
    </script>
  </body>
</html>
