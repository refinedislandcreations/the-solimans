[build]
  command = "npm run build"
  publish = "_site"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Custom 404 Page Mapping
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
