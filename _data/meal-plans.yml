categories:
  - name: balanced
    description: Solimans Balanced Menu presents an array of nourishing dishes that
      cater to diverse dietary preferences. The menu features choices from various
      cuisines, meticulously prepared to offer a holistic and healthful dining encounter.
      Ranging from crisp salads and lean protein to savory vegetarian and plant-based
      options, Solimans Balanced Menu seeks to harmonize flavors while advocating
      a well-balanced and wholesome dining approach. The menu underscores a dedication
      to providing options aligning with taste and nutrition, appealing to health-aware
      individuals and those pursuing a gratifying culinary journey.
  - name: high protein
    description: Discover our High Protein meals, perfect for building and maintaining
      muscle.
  - name: vegan
    description: Our Vegan meal plans are crafted for plant-based lifestyles.
  - name: custom
    description: Design your own meal plan with Custom options tailored to you.
